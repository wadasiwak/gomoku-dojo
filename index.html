    />

    <title>五子棋道場 ⚫ 連珠禁手 × AI 對弈</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="五子棋道場 ⚫ 連珠禁手 × AI 對弈" />
    <meta
      property="og:description"
      content="免費線上五子棋／連珠：黑棋禁手判定、四級 AI、VCF 搜索。純前端，免下載免註冊。"
    />
    <meta property="og:url" content="https://wadasiwak.github.io/gomoku-dojo/" />
    <meta name="twitter:card" content="summary" />
    <script>
      // 多執行緒版 Rapfi 已關閉（2026-10-14，連續搜尋偶發卡死，見 src/analysis/rapfi.ts
      // MULTI_THREAD_ENABLED）。先前在桌機造訪過的瀏覽器已註冊 coi-serviceworker（補 COOP/COEP）→
      // 這裡改成「不再註冊、已註冊的就註銷」：既有訪客下次造訪會自動重整一次回到一般頁面。
      // 等所有訪客都清掉後可整段連同 public/coi-serviceworker.js 移除。
      window.coi = {
        shouldRegister: function () {
          return false
        },
        shouldDeregister: function () {
          return true
        },
        coepDegrade: function () {
          return false
        },
      }
    </script>
    <script src="./coi-serviceworker.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 匿名流量統計（GoatCounter，無 cookie）。path 只回報 pathname，
      // hash/query（未來棋譜分享參數）絕不能進 analytics。
      window.goatcounter = {
        path: function () {
          return location.pathname
        },
      }
    </script>
    <script
      data-goatcounter="https://wadasiwak.goatcounter.com/count"
      async
      crossorigin="anonymous"
      src="//gc.zgo.at/count.js"
    ></script>
    <script
      src="https://wadasiwak.github.io/japan-planner/widget.js"
      data-site="gomoku-dojo"
      crossorigin="anonymous"
      defer
    ></script>
  </body>
